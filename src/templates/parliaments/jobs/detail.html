{% extends "base.html" %}
{% block title %}Job {{ job.id[:8] }} — {{ parliament.name }}{% endblock %}
{% block content %}
<div class="space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-lg font-semibold">
        {{ job.parliament }} · {{ job.stages | join(" → ") }}
      </h2>
      <div class="text-xs text-slate-500 font-mono">{{ job.id }}</div>
    </div>
    <a href="/parliaments/{{ parliament.id }}/jobs"
       class="inline-flex items-center gap-1 text-sm font-medium px-3 py-1.5 rounded border border-slate-300 text-slate-700 bg-white hover:bg-slate-50">← all jobs</a>
  </div>

  <div class="bg-white border border-slate-200 rounded-lg p-4"
       hx-get="/dashboard/job/{{ job.id }}" hx-trigger="load, every 2s" hx-swap="innerHTML">
    Loading…
  </div>

  <div>
    <h3 class="text-sm font-semibold text-slate-700 mb-1">Logs</h3>
    <pre id="logs" class="bg-slate-900 text-slate-100 text-xs font-mono rounded-lg p-3 h-[480px] overflow-y-auto whitespace-pre-wrap"></pre>
  </div>
</div>
<script>
  (function() {
    const pre = document.getElementById('logs');
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws/logs/{{ job.id }}');
    // Buffer incoming lines and flush at most once per frame. The backlog of a
    // long-running job arrives as thousands of separate frames on connect;
    // appending each one individually with `textContent +=` is O(n^2) and locks
    // the main thread for seconds. Batching + appendChild keeps it O(n).
    let buffer = [];
    let scheduled = false;
    function flush() {
      scheduled = false;
      if (!buffer.length) return;
      const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
      pre.appendChild(document.createTextNode(buffer.join('\n') + '\n'));
      buffer = [];
      if (atBottom) pre.scrollTop = pre.scrollHeight;
    }
    function schedule() {
      if (!scheduled) { scheduled = true; requestAnimationFrame(flush); }
    }
    ws.onmessage = function(ev) {
      buffer.push(ev.data);
      schedule();
    };
    ws.onclose = function() {
      buffer.push('[connection closed]');
      schedule();
    };
  })();
</script>
{% endblock %}
