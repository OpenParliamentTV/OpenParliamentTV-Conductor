{% extends "base.html" %}
{% block title %}Jobs — {{ parliament.name }}{% endblock %}
{% block content %}
<div class="space-y-6">
  <section>
    <h2 class="text-lg font-semibold mb-2">Current</h2>
    <div id="current-job" class="bg-white border border-slate-200 rounded-lg p-4 min-h-[64px]"
         hx-get="/parliaments/{{ parliament.id }}/jobs/fragments/current"
         hx-trigger="load, every 2s" hx-swap="innerHTML">
      Loading…
    </div>
  </section>

  <section>
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-lg font-semibold">Queue</h2>
      <button class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded border border-red-300 text-red-700 bg-white hover:bg-red-50"
              hx-post="/api/parliaments/{{ parliament.id }}/jobs/queue/clear"
              hx-swap="none"
              hx-confirm="Remove all queued jobs for {{ parliament.name }}? The running job is not affected."
              hx-on::after-request="htmx.ajax('GET','/parliaments/{{ parliament.id }}/jobs/fragments/queue','#queue-list')">empty queue</button>
    </div>
    <div id="queue-list" class="bg-white border border-slate-200 rounded-lg divide-y divide-slate-100"
         hx-get="/parliaments/{{ parliament.id }}/jobs/fragments/queue"
         hx-trigger="load, every 5s" hx-swap="innerHTML">
      Loading…
    </div>
  </section>

  <section>
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-lg font-semibold">History</h2>
      <button class="inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded border border-red-300 text-red-700 bg-white hover:bg-red-50"
              hx-post="/api/parliaments/{{ parliament.id }}/jobs/history/clear"
              hx-swap="none"
              hx-confirm="Delete all job history for {{ parliament.name }}? This cannot be undone."
              hx-on::after-request="htmx.ajax('GET','/parliaments/{{ parliament.id }}/jobs/fragments/recent?limit=50','#history-list')">empty history</button>
    </div>
    <div id="history-list" class="bg-white border border-slate-200 rounded-lg divide-y divide-slate-100"
         hx-get="/parliaments/{{ parliament.id }}/jobs/fragments/recent?limit=50"
         hx-trigger="load, every 10s" hx-swap="innerHTML">
      Loading…
    </div>
  </section>
</div>
{% endblock %}
